<!DOCTYPE html>
<html>

<head>
  <title>Juego Cazando</title>

  <script src="utils.js"></script>
  <link rel="stylesheet" href="cazando.css"/>

</head>

<body onload="iniciarJuego();">

  <div class="contenedor">

    <div class="encabezado">
      <div class="titulo">
        🐱
        <h1>Juego Cazando</h1>
        🐾
      </div>

      <p>¡El gato tiene hambre Apuratee!</p>
      <p class="autor">Autor: Domenica Pugo</p>
    </div>

    <div class="juego">
      <canvas id="areaJuego" width="500" height="500"></canvas>
    </div>

    <div class="panel">

      <div class="dato">
        <span>🏆</span>
        <span>Puntos</span>
        <strong id="puntos">0</strong>
      </div>

      <div class="dato">
        <span>⏱️</span>
        <span>Tiempo</span>
        <strong id="tiempo">10</strong>
      </div>

    </div>

    <div class="controles">

  <button onclick="moverArriba();">⬆</button>

  <div>
    <button onclick="moverIzquierda();">⬅</button>
    <button onclick="moverAbajo();">⬇</button>
    <button onclick="moverDerecha();">➡</button>
  </div>

  <button class="boton-reiniciar"
          onclick="reiniciar();">
    🔄 REINICIAR
  </button>

</div>

    </div>

    <p id="mensaje"></p>

  </div>

  <script src="cazando.js"></script>

</body>

</html>
